version: "3.9"
services:
  server:
    image: python:3.14-slim
    working_dir: /app
    volumes:
      - ../server:/app
    command: bash -lc "pip install fastapi pydantic python-multipart uvicorn && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  client-preview:
    image: node:22
    working_dir: /app
    volumes:
      - ../client:/app
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
